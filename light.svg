<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" fill="none">
  <defs>
    <!-- Background Gradient Light -->
    <radialGradient id="bgGradLight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>

    <!-- Ambient Glowing Orbs Light -->
    <radialGradient id="orbBlueLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyanLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Panel Glass Backdrops Light -->
    <linearGradient id="panelGlassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Border Gradient Light -->
    <linearGradient id="borderShimmerLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Heading Text Gradient Light -->
    <linearGradient id="headingGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Subtitle Role Gradient Light -->
    <linearGradient id="roleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Skill Pill Background Light -->
    <linearGradient id="pillBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Drop Shadows Light -->
    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Grid Pattern Overlay Light -->
    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0F172A" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="30" cy="30" r="1" fill="#2563EB" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Canvas Background Light -->
  <rect width="1180" height="610" rx="20" fill="url(#bgGradLight)"/>
  <rect width="1180" height="610" rx="20" fill="url(#gridLight)"/>

  <!-- Ambient Glow Orbs Light -->
  <circle cx="200" cy="150" r="300" fill="url(#orbBlueLight)"/>
  <circle cx="950" cy="450" r="350" fill="url(#orbCyanLight)"/>

  <!-- Outer Border Light -->
  <rect x="2" y="2" width="1176" height="606" rx="19" ry="19" fill="none" stroke="url(#borderShimmerLight)" stroke-width="2"/>

  <!-- =================================================== -->
  <!-- LEFT PANEL: PURE VECTOR HIGH-CONTRAST AVATAR CARD   -->
  <!-- =================================================== -->
  <g id="left-panel" transform="translate(30, 30)">
    <!-- Glass Container (Light) -->
    <rect width="410" height="550" rx="16" ry="16" fill="url(#panelGlassLight)" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#softShadowLight)"/>
    <rect width="410" height="550" rx="16" ry="16" fill="none" stroke="url(#borderShimmerLight)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Terminal Header Bar (Light) -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 394 0 A 16 16 0 0 1 410 16 L 410 38 L 0 38 Z" fill="#F1F5F9"/>
    <line x1="0" y1="38" x2="410" y2="38" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
    <!-- Window Control Dots -->
    <circle cx="20" cy="19" r="5.5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5.5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5.5" fill="#10B981"/>
    <!-- Title -->
    <text x="205" y="23" font-size="11" fill="#475569" class="font-mono" text-anchor="middle" font-weight="600">kamal_aassab.dev</text>

    <!-- Floating Avatar Frame Container -->
    <g transform="translate(0, 0)">
      <!-- Ambient Glow Behind Avatar (Light) -->
      <circle cx="205" cy="200" r="140" fill="url(#orbBlueLight)" opacity="0.6"/>

      <!-- Rotating Tech Rings (Light) -->
      <circle cx="205" cy="200" r="142" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.5"/>
      <circle cx="205" cy="200" r="148" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4 12" opacity="0.5"/>

      <!-- Main Border Ring (Light) -->
      <circle cx="205" cy="200" r="133" fill="none" stroke="url(#borderShimmerLight)" stroke-width="4"/>

      <!-- High Contrast Vector Developer Avatar Light -->
      <circle cx="205" cy="200" r="129" fill="#0F172A" stroke="rgba(37, 99, 235, 0.3)" stroke-width="1.5"/>
      <circle cx="205" cy="200" r="127" fill="url(#gridLight)" opacity="0.5"/>

      <!-- Vector Avatar Graphic Light -->
      <g transform="translate(205, 195)">
        <!-- Head -->
        <circle cx="0" cy="-28" r="44" fill="#38BDF8"/>
        <!-- Hair / Headset Arc -->
        <path d="M -50 -28 A 50 50 0 0 1 50 -28 L 56 -12 A 10 10 0 0 1 46 -2 L 40 -7 A 44 44 0 0 0 -40 -7 L -46 -2 A 10 10 0 0 1 -56 -12 Z" fill="#2563EB"/>
        <!-- Cyber Visor / Glasses -->
        <rect x="-34" y="-35" width="68" height="20" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
        <line x1="-26" y1="-25" x2="26" y2="-25" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
        <!-- Body / Hoodie -->
        <path d="M -80 70 C -80 28, -48 20, 0 20 C 48 20, 80 28, 80 70 Z" fill="#38BDF8"/>
        <!-- Collar -->
        <path d="M -24 20 L 0 46 L 24 20 Z" fill="#0F172A"/>
      </g>

      <!-- Inner Vignette Ring (Light) -->
      <circle cx="205" cy="200" r="133" fill="none" stroke="rgba(15, 23, 42, 0.15)" stroke-width="2"/>

      <!-- Floating Tech Overlay Badges (Light) -->
      <!-- Badge 1: Next.js & React -->
      <g transform="translate(30, 75)">
        <rect width="125" height="26" rx="13" ry="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" filter="url(#softShadowLight)"/>
        <text x="62.5" y="17" class="font-mono" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">NEXT.JS &amp; REACT</text>
      </g>
      <!-- Badge 2: AI Automations -->
      <g transform="translate(255, 300)">
        <rect width="125" height="26" rx="13" ry="13" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2" filter="url(#softShadowLight)"/>
        <text x="62.5" y="17" class="font-mono" font-size="10.5" fill="#0D9488" text-anchor="middle" font-weight="700">AI BUILDER</text>
      </g>

      <!-- Sub-Panel Information Box (Light) -->
      <rect x="25" y="355" width="360" height="125" rx="12" ry="12" fill="#F8FAFC" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1"/>
      <g class="font-mono" font-size="11">
        <text x="40" y="380" fill="#059669" font-weight="700">SYS.ID // KAMAL_AASSAB MA</text>
        <text x="40" y="402" fill="#475569">[v] Role: <tspan fill="#0F172A" font-weight="600">Full Stack &amp; AI Builder</tspan></text>
        <text x="40" y="422" fill="#475569">[v] Company: <tspan fill="#059669" font-weight="600">EMAPHOS / OCP Group</tspan></text>
        <text x="40" y="442" fill="#475569">[v] Focus: <tspan fill="#2563EB" font-weight="600">Premium Web Apps &amp; SaaS</tspan></text>
        <text x="40" y="462" fill="#0284C7" font-weight="700">&gt; Status: <tspan fill="#059669">AVAILABLE FOR PROJECTS</tspan> <tspan fill="#0F172A">_</tspan></text>
      </g>
    </g>

    <!-- Bottom Status Bar (Light) -->
    <rect x="25" y="498" width="360" height="32" rx="6" ry="6" fill="#F1F5F9" stroke="rgba(15, 23, 42, 0.08)"/>
    <circle cx="42" cy="514" r="4" fill="#10B981"/>
    <text x="54" y="518" class="font-mono" font-size="10.5" fill="#334155" font-weight="600">LOC: MOROCCO MA</text>
    <text x="368" y="518" class="font-mono" font-size="10.5" fill="#2563EB" text-anchor="end" font-weight="600">ONLINE</text>
  </g>

  <!-- =================================================== -->
  <!-- RIGHT PANEL: TERMINAL & INFORMATION DASHBOARD       -->
  <!-- =================================================== -->
  <g id="right-panel" transform="translate(465, 30)">
    <!-- Glass Container (Light) -->
    <rect width="685" height="550" rx="16" ry="16" fill="url(#panelGlassLight)" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#softShadowLight)"/>
    <rect width="685" height="550" rx="16" ry="16" fill="none" stroke="url(#borderShimmerLight)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Terminal Header Bar (Light) -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 669 0 A 16 16 0 0 1 685 16 L 685 38 L 0 38 Z" fill="#F1F5F9"/>
    <line x1="0" y1="38" x2="685" y2="38" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
    <!-- Window Control Dots -->
    <circle cx="20" cy="19" r="5.5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5.5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5.5" fill="#10B981"/>
    <!-- Title & Badge -->
    <text x="342" y="23" font-size="11" fill="#475569" class="font-mono" text-anchor="middle" font-weight="600">kamal@dev-machine: ~ (zsh)</text>
    <rect x="585" y="10" width="80" height="18" rx="4" ry="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="625" y="22" font-size="9.5" fill="#059669" class="font-mono" text-anchor="middle" font-weight="700">PROFILE</text>

    <!-- Main Content Area -->
    <!-- 1. GREETING & NAME -->
    <g transform="translate(30, 68)">
      <text font-size="25" class="font-sans" font-weight="800" fill="#0F172A">
        Hi I'm <tspan fill="url(#headingGradLight)">Kamal AASSAB</tspan>
      </text>
    </g>

    <!-- 2. ROLE TYPEWRITER -->
    <g transform="translate(30, 98)">
      <text class="font-mono" font-size="14.5" fill="url(#roleGradLight)" font-weight="700">&gt; Full Stack Web &amp; AI Automation Developer</text>
    </g>

    <!-- Divider Line -->
    <line x1="30" y1="130" x2="655" y2="130" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>

    <!-- 3. PERSONAL & PROFESSIONAL DETAILS GRID -->
    <g transform="translate(30, 148)">
      <!-- Row 1: Location -->
      <g transform="translate(0, 0)">
        <text class="font-sans" font-size="12" fill="#64748B" font-weight="600">Location</text>
        <text y="18" class="font-sans" font-size="12.5" fill="#0F172A" font-weight="600">Morocco MA</text>
      </g>

      <!-- Row 2: Current Position -->
      <g transform="translate(0, 48)">
        <text class="font-sans" font-size="12" fill="#64748B" font-weight="600">Current Position</text>
        <text y="18" class="font-sans" font-size="12.5" fill="#0F172A" font-weight="600">Financial &amp; CAPEX Operations (SAP) <tspan fill="#059669">@ EMAPHOS / OCP Group</tspan></text>
      </g>

      <!-- Row 3: Current Focus -->
      <g transform="translate(0, 96)">
        <text class="font-sans" font-size="12" fill="#64748B" font-weight="600">Current Focus</text>
        <text y="18" class="font-sans" font-size="12" fill="#334155" font-weight="500">
          Building Premium Websites * AI Automations * Business Systems * SaaS * Modern UI/UX * Next.js
        </text>
      </g>

      <!-- Row 4: Portfolio & Email -->
      <g transform="translate(0, 144)">
        <g transform="translate(0, 0)">
          <text class="font-sans" font-size="12" fill="#64748B" font-weight="600">Portfolio Website</text>
          <text y="18" class="font-sans" font-size="12.5" fill="#2563EB" font-weight="600">https://kamal-aassab.vercel.app</text>
        </g>
        <g transform="translate(300, 0)">
          <text class="font-sans" font-size="12" fill="#64748B" font-weight="600">Direct Contact</text>
          <text y="18" class="font-sans" font-size="12.5" fill="#0F172A" font-weight="600">kamal.aassab.ext@ocpgroup.ma</text>
        </g>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="30" y1="340" x2="655" y2="340" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>

    <!-- 4. CORE TECH & SKILLS BADGES -->
    <g transform="translate(30, 355)">
      <text font-size="12" class="font-sans" font-weight="700" fill="#64748B" letter-spacing="0.5">CORE TECHNOLOGIES &amp; ECOSYSTEM</text>
      
      <!-- Tech Grid -->
      <g transform="translate(0, 16)">
        <!-- Skill 1 -->
        <g transform="translate(0, 0)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">Next.js 14/15</text>
        </g>
        <!-- Skill 2 -->
        <g transform="translate(126, 0)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#0284C7" text-anchor="middle" font-weight="700">React 19</text>
        </g>
        <!-- Skill 3 -->
        <g transform="translate(252, 0)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#1D4ED8" text-anchor="middle" font-weight="700">TypeScript</text>
        </g>
        <!-- Skill 4 -->
        <g transform="translate(378, 0)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#0284C7" text-anchor="middle" font-weight="700">TailwindCSS</text>
        </g>
        <!-- Skill 5 -->
        <g transform="translate(504, 0)">
          <rect width="120" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="60" y="20" class="font-mono" font-size="11" fill="#D97706" text-anchor="middle" font-weight="700">Node.js</text>
        </g>

        <!-- Row 2 -->
        <!-- Skill 6 -->
        <g transform="translate(0, 40)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">Python AI</text>
        </g>
        <!-- Skill 7 -->
        <g transform="translate(126, 40)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#0284C7" text-anchor="middle" font-weight="700">SAP ERP</text>
        </g>
        <!-- Skill 8 -->
        <g transform="translate(252, 40)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#1D4ED8" text-anchor="middle" font-weight="700">PostgreSQL</text>
        </g>
        <!-- Skill 9 -->
        <g transform="translate(378, 40)">
          <rect width="118" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="59" y="20" class="font-mono" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">Docker</text>
        </g>
        <!-- Skill 10 -->
        <g transform="translate(504, 40)">
          <rect width="120" height="32" rx="8" fill="url(#pillBgLight)" stroke="url(#borderShimmerLight)" stroke-width="1"/>
          <text x="60" y="20" class="font-mono" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">AI Agents</text>
        </g>
      </g>
    </g>

    <!-- 5. FOOTER HIGHLIGHT -->
    <g transform="translate(30, 485)">
      <rect width="625" height="42" rx="8" fill="#F8FAFC" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1"/>
      <text x="20" y="25" class="font-mono" font-size="11.5" fill="#475569">
        Building high-performance web applications &amp; intelligent AI systems.
      </text>
      <text x="605" y="25" class="font-mono" font-size="11.5" fill="#059669" text-anchor="end" font-weight="700">AVAILABLE</text>
    </g>
  </g>
</svg>